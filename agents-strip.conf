# Config for the "agents" strip tmux server only (tmux -L agents).
# The dashboard is drawn in the pane by agents-strip.sh, so tmux's own status
# line is off and the whole window is the dashboard.
set -g status off
set -g mouse on
# Keep the outer terminal title stable so the launcher can find this window.
set -g set-titles on
set -g set-titles-string "agents-strip"
set -g escape-time 10
set -g base-index 1
set -g default-terminal "tmux-256color"
set -g pane-border-status off
setw -g pane-base-index 1

# Click a card: map the pane x-coordinate to a card and raise that agent's
# Ghostty window. Local to this server, so the main tmux is untouched.
bind -n MouseDown1Pane run-shell 'bash ~/.config/tmux/agents-strip.sh click #{mouse_x}'

# r forces an immediate redraw by restarting the watch loop in the active pane.
bind -n r respawn-pane -k 'bash ~/.config/tmux/agents-strip.sh watch'
